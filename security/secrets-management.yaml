# AWS Secrets Manager Integration
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-api
  namespace: sentinel
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/sentinel-production-api-irsa
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sentinel-secrets
  namespace: sentinel
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "sentinel-production-rds-password"
        objectType: "secretsmanager"
        objectAlias: "db-password"
      - objectName: "sentinel-production-api-key"
        objectType: "secretsmanager"
        objectAlias: "api-key"
      - objectName: "sentinel-production-admin-key"
        objectType: "secretsmanager"
        objectAlias: "admin-key"
  secretObjects:
    - secretName: sentinel-db-secret
      type: Opaque
      data:
        - key: password
          objectName: db-password
    - secretName: sentinel-api-secret
      type: Opaque
      data:
        - key: api-key
          objectName: api-key
        - key: admin-key
          objectName: admin-key
---
# Create secrets in AWS Secrets Manager with:
# aws secretsmanager create-secret \
#   --name sentinel-production-rds-password \
#   --secret-string "$(openssl rand -base64 32)"
#
# aws secretsmanager create-secret \
#   --name sentinel-production-api-key \
#   --secret-string "$(openssl rand -hex 32)"
#
# aws secretsmanager create-secret \
#   --name sentinel-production-admin-key \
#   --secret-string "$(openssl rand -hex 32)"
