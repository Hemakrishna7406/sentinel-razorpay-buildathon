apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
