apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel

resources:
  - ../base/api-deployment.yaml
  - ../base/worker-deployment.yaml
  - ../base/audit-deployment.yaml
  - ../base/service.yaml
  - ../base/ingress.yaml
  - network-policy.yaml
  - monitoring.yaml

patches:
  - path: patches/api-replicas.yaml
  - path: patches/resource-limits.yaml
  - path: patches/security-context.yaml

configMapGenerator:
  - name: sentinel-config
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - ENABLE_DEMO_ENDPOINTS=false

secretGenerator:
  - name: sentinel-secrets
    envs:
      - secrets.env
