version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelpassword
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sentinel-api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinelpassword@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_INBOUND_TOPIC=intents.inbound
      - KAFKA_EVALUATED_TOPIC=intents.evaluated
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
      - IDEMPOTENCY_TTL_SECONDS=86400
      - BEHAVIORAL_WINDOW_SECONDS=5
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  sentinel-worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinelpassword@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_INBOUND_TOPIC=intents.inbound
      - KAFKA_EVALUATED_TOPIC=intents.evaluated
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: python -m worker.evaluator
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  sentinel-audit:
    build: .
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinelpassword@postgres:5432/sentinel_db
      - KAFKA_BROKER=redpanda:29092
      - KAFKA_EVALUATED_TOPIC=intents.evaluated
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - .:/app
    command: python -m worker.audit_consumer
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./mlruns
      --host 0.0.0.0
      --port 5000

volumes:
  postgres_data:
  redis_data:
