apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.name }}
  labels:
    app: sentinel
    component: api
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sentinel
      component: api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: sentinel
        component: api
        release: {{ .Release.Name }}
      annotations:
        {{- toYaml .Values.api.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.securityContext | nindent 8 }}
      containers:
      - name: api
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: redis-url
        - name: KAFKA_BROKER
          value: "{{ .Release.Name }}-kafka:9092"
        - name: KAFKA_INBOUND_TOPIC
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: KAFKA_INBOUND_TOPIC
        - name: KAFKA_EVALUATED_TOPIC
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: KAFKA_EVALUATED_TOPIC
        - name: LOG_LEVEL
          value: {{ .Values.api.env.LOG_LEVEL | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | quote }}
        - name: JSON_LOGS
          value: {{ .Values.api.env.JSON_LOGS | quote }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.observability.jaeger.endpoint | quote }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.api.env.OTEL_SERVICE_NAME | quote }}
        - name: CAPABILITY_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: capability-signing-key
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: api-key
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: admin-api-key
        - name: DB_POOL_SIZE
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: DB_POOL_SIZE
        - name: DB_MAX_OVERFLOW
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: DB_MAX_OVERFLOW
        - name: IDEMPOTENCY_TTL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: IDEMPOTENCY_TTL_SECONDS
        - name: BEHAVIORAL_WINDOW_SECONDS
          valueFrom:
            configMapKeyRef:
              name: {{ .Release.Name }}-config
              key: BEHAVIORAL_WINDOW_SECONDS
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.api.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.api.readinessProbe | nindent 10 }}
        startupProbe:
          {{- toYaml .Values.api.startupProbe | nindent 10 }}
      {{- if .Values.api.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: {{ .Values.api.podAntiAffinity.weight }}
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
      {{- end }}
