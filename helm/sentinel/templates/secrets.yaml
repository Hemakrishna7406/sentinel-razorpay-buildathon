{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  labels:
    app: sentinel
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  # IMPORTANT: These are template placeholders.
  # In production, use external-secrets, sealed-secrets, or Vault to manage secrets.
  # DO NOT commit actual secret values to version control.

  # Database connection string (PostgreSQL)
  # Format: postgresql://username:password@host:port/database
  database-url: {{ .Values.secrets.DATABASE_URL | default "REPLACE_WITH_ACTUAL_DATABASE_URL" | quote }}

  # Redis connection string
  # Format: redis://[:password@]host:port/db
  redis-url: {{ .Values.secrets.REDIS_URL | default "REPLACE_WITH_ACTUAL_REDIS_URL" | quote }}

  # Capability token signing key (min 32 chars in production)
  capability-signing-key: {{ .Values.secrets.CAPABILITY_SIGNING_KEY | default "REPLACE_WITH_STRONG_SIGNING_KEY_MIN_32_CHARS" | quote }}

  # API authentication key (min 32 chars in production)
  api-key: {{ .Values.secrets.API_KEY | default "REPLACE_WITH_STRONG_API_KEY_MIN_32_CHARS" | quote }}

  # Admin API key (min 32 chars in production)
  admin-api-key: {{ .Values.secrets.ADMIN_API_KEY | default "REPLACE_WITH_STRONG_ADMIN_API_KEY_MIN_32_CHARS" | quote }}

  # Razorpay integration credentials (optional, if using Razorpay integration)
  razorpay-key-id: {{ .Values.secrets.RAZORPAY_KEY_ID | default "" | quote }}
  razorpay-key-secret: {{ .Values.secrets.RAZORPAY_KEY_SECRET | default "" | quote }}

  # Redis password (if Redis auth is enabled)
  redis-password: {{ .Values.secrets.REDIS_PASSWORD | default "REPLACE_WITH_REDIS_PASSWORD" | quote }}

  # PostgreSQL admin password
  postgres-admin-password: {{ .Values.secrets.POSTGRES_ADMIN_PASSWORD | default "REPLACE_WITH_POSTGRES_ADMIN_PASSWORD" | quote }}

  # PostgreSQL user password
  postgres-password: {{ .Values.secrets.POSTGRES_PASSWORD | default "REPLACE_WITH_POSTGRES_PASSWORD" | quote }}
{{- end }}
