groups:
  - name: sentinel.slos
    rules:
      # Authorization availability (5-minute window)
      - record: sentinel:authorization_success_rate:5m
        expr: |
          1 - (
            rate(sentinel_decisions_total{reason=~"REDIS_UNAVAILABLE|KAFKA_UNAVAILABLE|POLICY_ENGINE_UNAVAILABLE|DEPENDENCY_FAILURE"}[5m])
            /
            rate(sentinel_intents_total[5m])
          )

      # p50 / p95 / p99 authorization latency (5-minute window)
      - record: sentinel:authorization_latency_p50:5m
        expr: histogram_quantile(0.50, rate(sentinel_authorization_latency_seconds_bucket[5m]))

      - record: sentinel:authorization_latency_p95:5m
        expr: histogram_quantile(0.95, rate(sentinel_authorization_latency_seconds_bucket[5m]))

      - record: sentinel:authorization_latency_p99:5m
        expr: histogram_quantile(0.99, rate(sentinel_authorization_latency_seconds_bucket[5m]))

      # Worker utilization ratio
      - record: sentinel:worker_utilization:5m
        expr: sentinel_worker_active_tasks / sentinel_worker_capacity

      # Decision breakdown rates
      - record: sentinel:allow_rate:5m
        expr: rate(sentinel_decisions_total{decision="ALLOW"}[5m])

      - record: sentinel:escalate_rate:5m
        expr: rate(sentinel_decisions_total{decision="ESCALATE"}[5m])

      - record: sentinel:contain_rate:5m
        expr: rate(sentinel_decisions_total{decision="CONTAIN"}[5m])

      # ML inference p99
      - record: sentinel:ml_inference_p99:5m
        expr: histogram_quantile(0.99, rate(sentinel_ml_inference_latency_seconds_bucket[5m]))
