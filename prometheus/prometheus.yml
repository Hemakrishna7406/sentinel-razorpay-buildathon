global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "recording_rules.yml"

scrape_configs:
  - job_name: "sentinel-api"
    static_configs:
      - targets: ["sentinel-api:8000"]
    metrics_path: "/metrics"

  - job_name: "sentinel-worker"
    static_configs:
      - targets: ["sentinel-worker:8001"]
    metrics_path: "/metrics"

  - job_name: "sentinel-audit"
    static_configs:
      - targets: ["sentinel-audit:8002"]
    metrics_path: "/metrics"
